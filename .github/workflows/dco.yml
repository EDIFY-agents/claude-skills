name: dco

# Every commit must carry a Signed-off-by trailer. CONTRIBUTING.md explains what
# signing off certifies and why this project needs it: the FSL grant, the two-year
# Apache 2.0 conversion, and commercial builds all depend on inbound rights being
# unambiguous. A check is cheaper than asking a contributor to rewrite history six
# months later.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  signed-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: every commit in this PR is signed off
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format='%B' "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::missing Signed-off-by — $(git log -1 --format='%h %s' "$sha")"
              missing=1
            fi
          done < <(git rev-list "$BASE..$HEAD")
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Fix with:  git rebase --signoff $BASE && git push --force-with-lease"
            echo "See CONTRIBUTING.md — 'Contributor licensing'."
            exit 1
          fi
          echo "all commits signed off"
