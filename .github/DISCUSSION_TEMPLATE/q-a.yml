title: ""
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: >
        Repo size and languages, which agent, and what you have tried. Optional,
        but it usually turns a guess into an answer.
  - type: textarea
    id: doctor
    attributes:
      label: "`edify doctor`, if it is relevant"
      render: shell
